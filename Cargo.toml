[workspace]
members = [".", "apps/desktop/src-tauri"]
default-members = ["."]
resolver = "3"

[package]
name = "cathulu-core"
version = "0.1.0"
edition = "2021"
default-run = "cathulu-mcp"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
uuid = { version = "1.28.0", features = ["v4"] }
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml_edit = "0.25.17"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]

[[bin]]
name = "cathulu-mcp"
path = "src/bin/cathulu-mcp.rs"

[[bin]]
name = "cathulu-monitor"
path = "src/bin/cathulu-monitor.rs"
