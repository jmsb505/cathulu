[package]
name = "cathulu-desktop"
version = "0.1.0"
description = "A local project evidence dashboard and explicit Codex settings surface"
authors = ["Cathulu"]
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "cathulu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
cathulu-core = { path = "../../.." }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }

[dev-dependencies]
tauri = { version = "2.10.3", features = ["test"] }
serde_json = "1.0.149"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"
